<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Climate Budget Tagging">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#34B26C"/>
      <stop offset="1" stop-color="#0C6838"/>
    </linearGradient>
    <mask id="cut">
      <rect width="512" height="512" fill="#fff"/>
      <g stroke="#000" stroke-width="8" stroke-linecap="round" fill="none"><path d="M300 372 L372 330"/><path d="M300 322 L386 268"/><path d="M300 272 L390 212"/><path d="M300 222 L368 164"/><path d="M300 172 L336 128"/></g>
    </mask>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <g transform="translate(-14 0)">
    <!-- dollar sign, left half: top bowl and bottom terminal -->
    <path d="M256 132 H205 A45 45 0 0 0 205 222 H256 M256 380 H205 A45 45 0 0 1 160 335"
          fill="none" stroke="#fff" stroke-width="40" stroke-linejoin="round"/>
    <!-- vertical bar of the dollar = midrib of the leaf (continues below as the stem) -->
    <rect x="242" y="62" width="28" height="392" rx="14" fill="#fff"/>
    <!-- right half of the dollar sign becomes a leaf -->
    <path d="M286 84 C356 104 414 168 410 262 C406 352 356 404 286 424 Z" fill="#fff" mask="url(#cut)"/>
  </g>
</svg>
